name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge-repo
      # The bridge depends on the brymenble SDK (same-org sibling repo).
      # Adjust `repository` if the SDK lives elsewhere.
      - name: Checkout SDK (same-org sibling repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/brymenble
          path: brymenble
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ./brymenble
          pip install pytest
      - name: Run tests
        run: |
          cd bridge-repo
          python -m pytest -q
